<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Baburam Bastola | AI & Software Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #060810;
  --surface: #0d1117;
  --border:  rgba(0,255,136,0.12);
  --green:   #00ff88;
  --cyan:    #00d4ff;
  --purple:  #8b5cf6;
  --red:     #ff5f56;
  --yellow:  #ffbd2e;
  --text:    #e2e8f0;
  --muted:   #4a5568;
  --dim:     #2d3748;
  --glow-g:  rgba(0,255,136,0.15);
  --glow-c:  rgba(0,212,255,0.15);
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  overflow-x: hidden;
  cursor: none;
}

/* Custom cursor */
.cursor-dot {
  position: fixed;
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 12px var(--green);
  transition: transform 0.1s, background 0.2s;
}
.cursor-ring {
  position: fixed;
  width: 32px; height: 32px;
  border: 1px solid rgba(0,255,136,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: all 0.15s ease;
}

/* ═══════════════════════════════════════════
   GLOBAL GRID BACKGROUND
═══════════════════════════════════════════ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}

/* Corner brackets */
.corner { position: fixed; width: 55px; height: 55px; opacity: 0.3; z-index: 5; pointer-events: none; }
.corner.tl { top: 20px; left: 20px; border-top: 1px solid var(--green); border-left: 1px solid var(--green); }
.corner.tr { top: 20px; right: 20px; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
.corner.bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--green); border-left: 1px solid var(--green); }
.corner.br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

/* Scanline */
.scanline {
  position: fixed; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,255,136,0.12), rgba(0,212,255,0.1), transparent);
  animation: scanMove 8s linear infinite;
  pointer-events: none; z-index: 4;
}
@keyframes scanMove {
  0%   { top: -2px; opacity: 0; }
  3%   { opacity: 1; }
  97%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2.5rem;
  height: 64px;
  background: rgba(6,8,16,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem; font-weight: 800;
  color: var(--green);
  text-decoration: none;
  letter-spacing: -0.02em;
  text-shadow: 0 0 20px rgba(0,255,136,0.5);
}
.nav-logo span { color: var(--text); }

.nav-links {
  display: flex; gap: 2rem;
  list-style: none;
}
.nav-links a {
  text-decoration: none;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::before {
  content: '// ';
  color: var(--green);
  opacity: 0;
  transition: opacity 0.2s;
}
.nav-links a:hover { color: var(--text); }
.nav-links a:hover::before { opacity: 1; }

.nav-cv {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--green);
  border: 1px solid rgba(0,255,136,0.4);
  padding: 0.4rem 1rem;
  transition: all 0.25s;
}
.nav-cv:hover {
  background: rgba(0,255,136,0.1);
  box-shadow: 0 0 20px rgba(0,255,136,0.2);
}

.nav-mobile-btn { display: none; background: none; border: none; color: var(--green); font-size: 1.2rem; cursor: pointer; }

/* ═══════════════════════════════════════════
   HERO SECTION
═══════════════════════════════════════════ */
#hero {
  position: relative;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: flex-start;
  padding: 100px 2.5rem 4rem;
  overflow: hidden;
}

/* ── SHADOW CANVAS ── */
#shadow-canvas {
  position: absolute;
  top: 0; right: 0;
  width: 55%; height: 100%;
  pointer-events: none;
  z-index: 1;
  opacity: 0.9;
}

/* Radial fade on right side */
#shadow-canvas::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--bg) 0%, transparent 30%, transparent 70%, var(--bg) 100%);
}

.hero-glow {
  position: absolute;
  right: 15%;
  top: 50%;
  transform: translateY(-50%);
  width: 500px; height: 600px;
  background: radial-gradient(ellipse, rgba(0,255,136,0.05) 0%, rgba(0,212,255,0.03) 40%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── HERO CONTENT ── */
.hero-content {
  position: relative;
  z-index: 10;
  max-width: 680px;
}

.terminal-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 2.2rem;
  opacity: 0; animation: fadeUp 0.6s ease forwards 0.3s;
}
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.dot.r { background: var(--red);    box-shadow: 0 0 8px var(--red); }
.dot.y { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.dot.g { background: #27c93f;       box-shadow: 0 0 8px #27c93f; }
.terminal-title { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; margin-left: 10px; }

.prompt-line {
  font-size: 0.8rem; color: var(--muted);
  margin-bottom: 1rem;
  opacity: 0; animation: fadeUp 0.6s ease forwards 0.6s;
}
.prompt-line .user { color: var(--green); }
.prompt-line .dir  { color: var(--cyan); }

.hero-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 0.5rem;
  opacity: 0; animation: fadeUp 0.7s ease forwards 0.9s;
}
.hero-name .comment { color: var(--muted); font-size: 0.35em; font-family: 'JetBrains Mono'; font-weight: 400; display: block; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
.hero-name .bracket { color: var(--green); }

.iam-line {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: clamp(1rem, 2.2vw, 1.4rem);
  margin-bottom: 2rem; min-height: 2.2rem;
  opacity: 0; animation: fadeUp 0.7s ease forwards 1.2s;
}
.iam-prefix { color: var(--muted); font-weight: 300; }
#typewriter-text {
  font-weight: 600;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(0,255,136,0.5));
  transition: filter 0.3s;
}
.typed-cursor {
  color: var(--green) !important;
  -webkit-text-fill-color: var(--green) !important;
  text-shadow: 0 0 10px var(--green);
  animation: cursorBlink 0.75s step-end infinite;
}
@keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

.badges {
  display: flex; flex-wrap: wrap; gap: 0.6rem;
  margin-bottom: 2.2rem;
  opacity: 0; animation: fadeUp 0.7s ease forwards 1.5s;
}
.badge {
  font-size: 0.65rem; letter-spacing: 0.14em;
  padding: 0.32rem 0.8rem; text-transform: uppercase;
  border-radius: 3px; position: relative; overflow: hidden;
}
.badge::before { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0.08; }
.badge.g { color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
.badge.c { color: var(--cyan);  border: 1px solid rgba(0,212,255,0.3); }
.badge.p { color: #a78bfa;      border: 1px solid rgba(139,92,246,0.3); }
.dot-live { display: inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:6px; animation: pulseDot 1.5s ease infinite; vertical-align: middle; }
@keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.6)} }

.cta-group {
  display: flex; gap: 1rem; flex-wrap: wrap;
  opacity: 0; animation: fadeUp 0.7s ease forwards 1.8s;
}
.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
  text-decoration: none; padding: 0.75rem 1.6rem;
  border: none; cursor: pointer; transition: all 0.25s;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.btn-primary {
  background: var(--green); color: #060810; font-weight: 700;
  box-shadow: 0 0 24px rgba(0,255,136,0.3);
}
.btn-primary:hover { box-shadow: 0 0 36px rgba(0,255,136,0.55); transform: translateY(-2px); }
.btn-outline {
  background: transparent; color: var(--cyan);
  border: 1px solid rgba(0,212,255,0.35);
}
.btn-outline:hover { background: rgba(0,212,255,0.08); box-shadow: 0 0 20px rgba(0,212,255,0.2); transform: translateY(-2px); }

/* ═══════════════════════════════════════════
   SECTION COMMONS
═══════════════════════════════════════════ */
section { position: relative; z-index: 2; padding: 6rem 2.5rem; }
section:nth-child(even) { background: rgba(13,17,23,0.6); }

.section-header {
  display: flex; align-items: center; gap: 1.2rem;
  margin-bottom: 3.5rem;
}
.section-num {
  font-size: 0.7rem; color: var(--green);
  letter-spacing: 0.15em; white-space: nowrap;
}
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 800; color: var(--text);
  letter-spacing: -0.02em;
}
.section-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}
.container { max-width: 1100px; margin: 0 auto; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
