<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent | Baburam Bastola</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF6F0;
            --bg-surface: #F3EDE2;
            --accent-burgundy: #6B1E2B;
            --accent-burgundy-light: #8B2F3D;
            --accent-gradient: linear-gradient(135deg, var(--accent-burgundy) 0%, var(--accent-burgundy-light) 100%);
            --text-primary: #1A1615;
            --text-secondary: #615C5A;
            --font-display: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition-speed: 0.3s;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }
        .glass-card {
            background: var(--bg-surface);
            border: 1px solid #E4DCD3;
            border-radius: 16px;
            padding: 60px;
            box-shadow: 0 15px 35px rgba(26, 22, 21, 0.08);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.8rem;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-speed);
        }
        .btn.primary {
            background: var(--accent-gradient);
            color: var(--bg-primary);
            box-shadow: 0 4px 20px rgba(107, 30, 43, 0.15);
        }
        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(107, 30, 43, 0.25);
        }
        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="glass-card">
                <h1>Message Sent! 🚀</h1>
                <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 30px;">
                    Thank you for reaching out. I have received your message and will get back to you shortly.
                </p>
                <a href="/" class="btn primary">Return Home</a>
            </div>
        </div>
    </main>
</body>

</html>
